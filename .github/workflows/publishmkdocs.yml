name: publishmkdocs
on:
  push:
    branches:
      - main
    paths:
      - "archive/**"
      - ".github/workflows/publishmkdocs.yml"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Pinned: the cutover banner is a theme override (archive/overrides/main.html
      # extending base.html's `announce` block), so the build now depends on the
      # theme's template API. An unpinned install would take that dependency
      # against whatever ships next — and MkDocs 2.0 is slated to drop the plugin
      # system that overrides rely on. Keeping the archive publishable is a
      # standing rule (AGENTS.md), so the version is explicit.
      - run: pip install 'mkdocs-material==9.7.7'
      - run: mkdocs gh-deploy --force -f archive/mkdocs.yml
