name: ci
# pull_request is the primary trigger — push events from the bot's API merges
# are unreliable in this repo. push:main runs opportunistically as a backstop.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test 2>&1 | tee /tmp/test-output.txt
        shell: bash
      # Making a failure legible from the ops pod (cigar-journal#174, scope 1).
      # Actions log downloads are egress-blocked there, and a job SUMMARY is not
      # served by any REST endpoint — which is why every past failure read only
      # as "Process completed with exit code 1". An ::error:: annotation IS
      # served, by /check-runs/{id}/annotations on api.github.com, so the tail
      # goes to both: the summary for a human in the browser, an annotation for
      # anything reading over the API.
      - if: failure()
        run: |
          {
            echo '## test failure tail'
            echo '```'
            tail -c 6000 /tmp/test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotation messages are a single line: encode newlines as %0A, and
          # escape a literal % first or the encoding eats it. Two annotations —
          # the failing test names are the answer most of the time, and the tail
          # carries the assertion when they are not.
          # `run:` is bash -e, so a non-matching grep would abort the step and
          # lose the tail: every extraction is `|| true`.
          # ANSI colour first, or the annotation is unreadable; then escape a
          # literal % (before the newline encoding, which uses %) and fold to
          # one line as %0A.
          plain() { sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g'; }
          fold() { awk '{ printf "%s%%0A", $0 }'; }
          PLAIN=/tmp/test-plain.txt
          plain < /tmp/test-output.txt > "$PLAIN"
          # A failing assertion names its test; an UNHANDLED error names none, so
          # capture that section's HEAD (the message and stack) rather than the
          # tail, which is usually a dumped object.
          NAMES=$(grep -aE '(FAIL|×|✗)' "$PLAIN" | head -40 | fold || true)
          if [ -n "$NAMES" ]; then echo "::error title=failing tests::${NAMES}"; fi
          ERRS=$(grep -aA 25 -E 'Unhandled (Error|Rejection)|Errors  *[0-9]+ error' "$PLAIN" \
                   | head -60 | cut -c1-300 | fold || true)
          if [ -n "$ERRS" ]; then echo "::error title=unhandled errors::${ERRS}"; fi
          TAIL=$(tail -c 2500 "$PLAIN" | fold || true)
          echo "::error title=test failure tail::${TAIL}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Real-browser click-through suite (issue #48): embedded Postgres + a production
  # `next start`, driven by Playwright. Kept a SEPARATE job so `pnpm test` (vitest)
  # stays fast and the three required checks above are untouched. Non-blocking of
  # the vitest contract by design — add it to branch protection when it has proven
  # stable.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p apps/web/e2e/tsconfig.json
      # Cache the Playwright browser bundle across runs; the install step is a
      # no-op download on a hit but still wires up the OS deps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      # Production build first — the harness runs `next start`, never `next dev`.
      - run: pnpm build
      - run: pnpm test:e2e
      # Traces are the only readable failure signal from the ops pod (Actions logs
      # are unreachable there); publish them on failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/e2e/.artifacts/test-results/
          retention-days: 7
          if-no-files-found: ignore
