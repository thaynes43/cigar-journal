name: Claude Code

# Interactive "@claude" handler: mention @claude in an issue, a PR comment or a
# review and Claude picks the work up from there. claude-code-action's default
# applies: only actors with write access can trigger it (never widen that).
# Skips cleanly (green) when the CLAUDE_CODE_OAUTH_TOKEN repo secret is absent.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One @claude run per thread; a follow-up mention supersedes an in-flight one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude mention handler
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token (used to comment)
      actions: read # lets Claude read CI results on PRs

    steps:
      # Secrets cannot appear in `if:`, so gate on a step output instead.
      - name: Check for Claude token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude skipped::CLAUDE_CODE_OAUTH_TOKEN is not set for this repository."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.gate.outputs.enabled == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent-authored issues/PRs come from the dev bot; allow it to summon Claude.
          allowed_bots: "haynes-dev-bot"
          # Pinned to the newest Opus explicitly, never an alias.
          claude_args: "--model claude-opus-5-5"
          additional_permissions: |
            actions: read
