name: spike-image
# Build + push the Phase 0 MCP spike image. Throwaway — delete with spike/.
on:
  push:
    branches:
      - main
    paths:
      - "spike/**"
      - ".github/workflows/spike-image.yml"
  # push events from the bot's API merges don't fire in this repo; PR events do.
  pull_request:
    branches:
      - main
    paths:
      - "spike/**"
      - ".github/workflows/spike-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thaynes43/cigar-journal-spike

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=spike-latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./spike
          file: ./spike/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
