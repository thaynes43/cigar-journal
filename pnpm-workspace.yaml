packages:
  - apps/*
  - packages/*

# Build scripts are opt-in since pnpm 10. esbuild (pulled in transitively by the
# toolchain) ships a native binary via a build script; allow it so installs stay
# non-interactive. Same lesson the spike carried — keep the gate, extend the list.
allowBuilds:
  esbuild: true
  # Ships the Postgres 16 binaries the test suite runs against (no Docker in
  # this env); its postinstall rehydrates the shared-library symlinks.
  "@embedded-postgres/linux-x64": true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.2'
  - '@better-auth/drizzle-adapter@1.7.2'
  - '@better-auth/kysely-adapter@1.7.2'
  - '@better-auth/memory-adapter@1.7.2'
  - '@better-auth/mongo-adapter@1.7.2'
  - '@better-auth/prisma-adapter@1.7.2'
  - '@better-auth/telemetry@1.7.2'
  - better-auth@1.7.2
