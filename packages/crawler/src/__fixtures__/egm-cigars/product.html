<!-- Live shape 2026-09-02, /products/cohiba-siglo-6-slb. Two ld+json blocks, an
     Organization and a **ProductGroup** — Shopify's shape, and the reason
     `extractJsonLd` accepts ProductGroup as a Product (#270).
     Three things this page proves, all live:
       * the group states `category` and NO breadcrumb node, hence
         `categorySource: "json-ld-category"`;
       * the group states no `offers` of its own — the price is on the first
         variant, which the extractor lifts;
       * the group states no `image`, and the photo is the 2000x2000
         `og:image:secure_url` (the `og:image` beside it is the same asset over
         plain http). Its price key is `og:price:amount`, not
         `product:price:amount`, and is not read. -->
