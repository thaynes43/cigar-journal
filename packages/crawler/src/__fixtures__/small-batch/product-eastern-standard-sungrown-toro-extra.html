<!doctype html>
<!-- A nopCommerce GROUPED product, in the shape the live read of 2026-09-02

     `price: "0.00"` because the parent has no single price, and the real figures
     live only in the per-pack `product-variant-line` blocks of the HTML below.
     Synthetic bytes, faithful structure — `sku`, `availability`, `image` and the
     brand-first breadcrumb trail are all as the live pages carry them, and the
     variant markup was CORRECTED to the live shape on 2026-09-03 (#270) from the
     pages recorded beside it as `live-product-*.html`: a `product-variant-list`
     of `product-variant-line` blocks whose label, stock word and price are keyed
     to one `data-productid`.

     The taxonomy names no "cigars" category anywhere. That is the whole reason
     this adapter's `cigarCategoryPattern` is `/./`. -->
