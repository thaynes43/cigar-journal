<!doctype html>
<!-- SYNTHETIC, the second product for `vendor.example` (see product.html): the
     probe parses three spread-apart URLs, so the set needs more than one. An
     accessory, so the category gate is exercised as well as the parse. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Xikar Xi3 Cutter — Vendor Example</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://vendor.example/" },
        { "@type": "ListItem", "position": 2, "name": "Accessories", "item": "https://vendor.example/store/accessories/" },
        { "@type": "ListItem", "position": 3, "name": "Cutters", "item": "https://vendor.example/store/accessories/cutters/" },
        { "@type": "ListItem", "position": 4, "name": "Xikar Xi3 Cutter" }
      ]
    },
    {
      "@type": "Product",
      "name": "Xikar Xi3 Cutter",
      "url": "https://vendor.example/store/xikar-xi3-cutter/",
      "image": "https://vendor.example/img/xikar-xi3.jpg",
      "sku": "XIK-XI3",
      "offers": [
        {
          "@type": "Offer",
          "price": "64.99",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      ]
    }
  ]
}
</script>
</head>
<body><h1>Xikar Xi3 Cutter</h1></body>
</html>
